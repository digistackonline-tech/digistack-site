<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <defs>
    <linearGradient id="metaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Emblem Icon: Stylized Geometric M with Plus -->
  <g transform="translate(40, 30)">
    <!-- Hexagon/Cube Outline Background -->
    <path d="M 60 10 L 110 38 L 110 98 L 60 126 L 10 98 L 10 38 Z" fill="#0f172a" rx="6"/>
    <!-- Folded M facets -->
    <path d="M 28 85 L 28 50 L 60 74 L 60 110 Z" fill="url(#metaGrad)"/>
    <path d="M 92 85 L 92 50 L 60 74 L 60 110 Z" fill="#38bdf8"/>
    <path d="M 28 50 L 60 26 L 92 50 L 60 74 Z" fill="#0284c7" opacity="0.85"/>
    <!-- Plus Badge in upper right -->
    <circle cx="104" cy="28" r="18" fill="url(#plusGrad)" stroke="#ffffff" stroke-width="3"/>
    <path d="M 104 18 L 104 38 M 94 28 L 114 28" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="195" y="105" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="#0f172a" letter-spacing="-0.5">META<tspan fill="#0284c7">PLUS</tspan></text>
  <text x="198" y="148" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="24" fill="#64748b" letter-spacing="8">PERKASA</text>
  
  <rect x="198" y="166" width="340" height="3" fill="#e2e8f0" rx="1.5"/>
  <text x="198" y="188" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="2">PACKAGING &amp; MANUFACTURING</text>
</svg>
