name: CF Debug Info

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Get Pages project info
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/digistack" \
            | python3 -m json.tool > project_info.json
          echo "=== production_branch ==="
          python3 -c "import json; d=json.load(open('project_info.json')); print(d['result'].get('production_branch'))"
          echo "=== domains ==="
          python3 -c "import json; d=json.load(open('project_info.json')); print(d['result'].get('domains'))"
          echo "=== subdomain ==="
          python3 -c "import json; d=json.load(open('project_info.json')); print(d['result'].get('subdomain'))"
          echo "=== latest deployment (canonical) info ==="
          curl -s -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/digistack/deployments?env=production" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); [print(x['id'], x.get('deployment_trigger',{}).get('metadata',{}).get('branch'), x['created_on'], x.get('url')) for x in d['result'][:5]]"
